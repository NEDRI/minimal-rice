# lorien-rice: Qt apps (Konsole, Dolphin, ...) draw GNOME-style (Adwaita) title bars where the
# compositor leaves decorations to the app, i.e. in GNOME. KDE draws server-side decorations, so
# this has no effect there. Needs qadwaitadecorations-qt6 (by its own name: "adwaita" picks the
# plugin built into Qt 6, which ignores our smaller sizes).
QT_WAYLAND_DECORATION=qadwaitadecorations
